<!-- Client Performance Diagnostic — Mode report (PROOF OF CONCEPT).
     Proves the end-to-end pipeline: params -> SQL queries -> window.datasets -> HTML/JS.
     Renders (1) the prospecting YoY metrics table and (2) monthly trend charts (Chart.js),
     both resolved from window.datasets by query name. This is module 04 + 05 only; the
     remaining ~20 modules follow the same pattern (add a query -> resolve -> render). -->
<link href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Chart.js only — NO date adapter is loaded, so scales must never use type:"time"
     (throws "This method is not implemented: Check that a complete date adapter is provided").
     For date axes use type:"linear" with ms values + a tick callback (see modules 03 / 11). -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>

         margin:0; padding:28px 34px; }

  #cpd th.metric, #cpd td.metric { text-align:left; }
  #cpd td { text-align:right; font-size:15px; padding:7px 14px; }
  #cpd tr:nth-child(even) td { background:#00000005; }
  #cpd .delta { font-weight:700; }
  #cpd .good { color:#2E8B57; } #cpd .bad { color:#D63B2F; } #cpd .ctx { color:#888; }
  #cpd .grid { display:grid; grid-template-columns:repeat(3, minmax(240px,1fr)); gap:18px 26px; max-width:1120px; }
  #cpd .panel { background:#fff; border:1px solid #eee; border-radius:6px; padding:10px 12px 4px; }
  #cpd .panel .t { font-size:13px; font-weight:700; color:#333; margin:0 0 4px; }

                 position:sticky; top:0; background:#FAFAFA; z-index:5; }
  #cpd .tabbtn { font:600 13px "Helvetica Neue", Inter, Arial, sans-serif; color:#555; background:transparent;
                 border:none; padding:9px 16px 7px; cursor:pointer; border-radius:4px 4px 0 0; }
  #cpd .tabbtn:hover { background:rgba(39,73,109,0.08); color:#27496D; }
  #cpd .tabbtn.active { background:#27496D; color:#fff; }
</style>

<div id="cpd"><div class="loading">Loading client performance diagnostic…</div></div>

<script>
(function () {
  "use strict";
  var NAVY = "#27496D", RED = "#D63B2F", GRAY = "#9AA0A6";

  // ---- resolve a Mode dataset: by normalized name first, else by a signature column.
  //      Robust to query naming ("04 YoY Metrics" vs "04_yoy_metrics") and to Mode not
  //      exposing .name — a dataset is identified by a column only it has (period / month). ----
  var norm = function (s) { return (s || "").toString().toLowerCase().replace(/[^a-z0-9]/g, ""); };
  function withRows(d) { return d && Array.isArray(d.content) && d.content.length; }
  function ds(name, sigCol) {
    var all = window.datasets;
    if (!all || !all.length) return null;
    var hit = all.find(function (d) { return withRows(d) && norm(d.name) === norm(name); });
    if (!hit && sigCol) hit = all.find(function (d) {
      return withRows(d) && Object.prototype.hasOwnProperty.call(d.content[0], sigCol);
    });
    return hit ? hit.content : null;
  }
  var num = function (v) { return v == null || v === "" ? 0 : +v; };
  var fmtK = function (v) { var a = Math.abs(v);
    return a >= 1e6 ? (v/1e6).toFixed(1)+"M" : a >= 1e3 ? Math.round(v/1e3)+"k" : Math.round(v).toString(); };
  var money = function (v) { return "$" + fmtK(v); };

  // metric = [label, fn(row)->value, formatter, goodDir]  (goodDir: +1 up-good, -1 down-good, 0 context)
  var METRICS = [
    // raw counts — funnel order (spend in -> delivery -> visit -> conversion -> revenue out)
    ["Spend",            function (r){return r.spend;},                       money,                              0],
    ["Impressions",      function (r){return r.impressions;},                 function (v){return fmtK(v);},      0],
    ["Visits",           function (r){return r.visits;},                      function (v){return fmtK(v);},      1],
    ["Conversions",      function (r){return r.conversions;},                 function (v){return fmtK(v);},      1],
    ["Revenue",          function (r){return r.revenue;},                     money,                              1],
    // calculated rates — funnel order again (CPM -> IVR -> CVR -> AOV -> ROAS)
    ["CPM",              function (r){return 1000*r.spend/r.impressions;},     function (v){return "$"+v.toFixed(2);}, -1],
    ["IVR",              function (r){return 100*r.visits/r.impressions;},     function (v){return v.toFixed(3)+"%";}, 1],
    ["CVR",              function (r){return 100*r.conversions/r.visits;},     function (v){return v.toFixed(2)+"%";}, 1],
    ["AOV",              function (r){return r.revenue/r.conversions;},        function (v){return "$"+v.toFixed(2);}, 1],
    ["ROAS",             function (r){return r.revenue/r.spend;},              function (v){return v.toFixed(2)+"x";}, 1]
  ];

  function renderYoY(rows) {
    var P = {};
    rows.forEach(function (r) { P[r.period] = { impressions:num(r.impressions), visits:num(r.visits),
      spend:num(r.spend), conversions:num(r.conversions), revenue:num(r.revenue) }; });
    if (!P.P1 || !P.P2) return '<div class="err">YoY table needs both P1 and P2 rows (got: ' + Object.keys(P).join(", ") + ").</div>";
    var h = '<table><tr><th class="metric">Metric</th><th>Prior year (P1)</th><th>Selected (P2)</th><th>Δ %</th></tr>';
    METRICS.forEach(function (m) {
      var v1 = m[1](P.P1), v2 = m[1](P.P2), fmt = m[2], good = m[3];
      var d = v1 ? 100*(v2/v1 - 1) : null;
      var cls = (good === 0 || d == null) ? "ctx" : (d*good > 0 ? "good" : "bad");
      h += '<tr><td class="metric">' + m[0] + "</td><td>" + (isFinite(v1)?fmt(v1):"—")
        + "</td><td>" + (isFinite(v2)?fmt(v2):"—") + '</td><td class="delta ' + cls + '">'
        + (d == null ? "n/a" : (d>=0?"+":"") + d.toFixed(1) + "%") + "</td></tr>";
    });
    return h + "</table>";
  }

  // small monthly line chart into a <canvas>; zeroIdx = month indices with $0 spend,
  // shaded light red so gaps/weird rates are explainable at a glance
  function line(canvas, labels, data, color, zeroIdx) {
    var shade = {
      id: "zeroShade",
      beforeDatasetsDraw: function (chart) {
        if (!zeroIdx || !zeroIdx.length) return;
        var x = chart.scales.x, a = chart.chartArea, ctx = chart.ctx;
        if (!x || !a) return;
        ctx.save();
        ctx.fillStyle = "rgba(214,59,47,0.08)";
        zeroIdx.forEach(function (i) {
          var c = x.getPixelForValue(i);
          var l = i > 0 ? (x.getPixelForValue(i - 1) + c) / 2 : a.left;
          var r = i < labels.length - 1 ? (x.getPixelForValue(i + 1) + c) / 2 : a.right;
          ctx.fillRect(l, a.top, r - l, a.bottom - a.top);
        });
        ctx.restore();
      }
    };
    new Chart(canvas, { type:"line",
      data:{ labels:labels, datasets:[{ data:data, borderColor:color, backgroundColor:color,
             borderWidth:2, pointRadius:2, tension:0.15, spanGaps:true }] },
      options:{ plugins:{legend:{display:false}}, responsive:true, maintainAspectRatio:false,
        scales:{ x:{ ticks:{ maxTicksLimit:6, font:{size:10} }, grid:{display:false} },
                 y:{ ticks:{ font:{size:10} }, grid:{color:"#eee"} } } },
      plugins: [shade] });
  }

  function renderMonthly(rows) {
    // continuous month axis: fill missing months so gaps are visible, not skipped
    var by = {};
    rows.forEach(function (r) { by[String(r.month).slice(0, 7)] = r; });
    var keys = Object.keys(by).sort();
    if (!keys.length) return '<div class="err">No monthly data.</div>';
    var months = [];
    (function () {
      var y = +keys[0].slice(0, 4), m = +keys[0].slice(5, 7);
      var ye = +keys[keys.length - 1].slice(0, 4), me = +keys[keys.length - 1].slice(5, 7);
      while (y < ye || (y === ye && m <= me)) {
        months.push(y + "-" + ("0" + m).slice(-2));
        if (++m > 12) { m = 1; y++; }
      }
    })();
    var M = months.map(function (k) {
      var r = by[k] || {};
      return { spend: num(r.spend), impressions: num(r.impressions), visits: num(r.visits),
               conversions: num(r.conversions), revenue: num(r.revenue) };
    });
    var zeroIdx = [];
    M.forEach(function (r, i) { if (r.spend === 0) zeroIdx.push(i); });
    // color rule: revenue-derived metrics (Revenue, AOV, ROAS) draw RED, all else navy
    var series = [
      // raw counts — funnel order
      ["Spend", M.map(function(r){return r.spend;}), NAVY],
      ["Impressions", M.map(function(r){return r.impressions;}), NAVY],
      ["Visits", M.map(function(r){return r.visits;}), NAVY],
      ["Conversions", M.map(function(r){return r.conversions;}), NAVY],
      ["Revenue", M.map(function(r){return r.revenue;}), RED],
      // calculated rates — funnel order; null where the denominator is 0
      ["CPM", M.map(function(r){return r.impressions?1000*r.spend/r.impressions:null;}), NAVY],
      ["IVR %", M.map(function(r){return r.impressions?100*r.visits/r.impressions:null;}), NAVY],
      ["CVR %", M.map(function(r){return r.visits?100*r.conversions/r.visits:null;}), NAVY],
      ["AOV", M.map(function(r){return r.conversions?r.revenue/r.conversions:null;}), RED],
      ["ROAS", M.map(function(r){return r.spend?r.revenue/r.spend:null;}), RED]
    ];
    var html = '<div class="grid">' + series.map(function (s, i) {
      return '<div class="panel"><div class="t' + (s[2] === RED ? '" style="color:' + RED : '') + '">' + s[0] + '</div>'
           + '<div style="height:150px"><canvas id="cpd-c' + i + '"></canvas></div></div>';
    }).join("") + "</div>";
    var notes = ['<span style="color:' + RED + ';font-weight:700;">red</span> = revenue-based (Revenue, AOV, ROAS)'];
    if (zeroIdx.length) {
      notes.push('<span style="display:inline-block;width:11px;height:11px;background:rgba(214,59,47,0.25);border-radius:2px;vertical-align:-1px;"></span> '
        + 'shaded months = $0 prospecting spend (' + zeroIdx.map(function(i){ return months[i]; }).join(", ")
        + ') — rate metrics there are blank, and adjacent partial months can look extreme');
    }
    html += '<div style="font-size:11px;color:#888;margin-top:8px;">' + notes.join('  ·  ') + '</div>';
    setTimeout(function () { series.forEach(function (s, i) {
      var c = document.getElementById("cpd-c" + i); if (c) line(c, months, s[1], s[2], zeroIdx);
    }); }, 0);
    return html;
  }


  // ---- shared helpers for ported module renders ----
  var H = {

    num: function (v){ return (v==null||v==="")?0:+v; },
    fmtK: function (v){ v=+v||0; var a=Math.abs(v); return a>=1e6?(v/1e6).toFixed(1)+"M":a>=1e3?Math.round(v/1e3)+"k":(""+Math.round(v)); },
    money: function (v){ return "$"+H.fmtK(v); },
    pctShare: function (x){ x=+x||0; return (x>0&&x<0.01)?"<1%":Math.round(x*100)+"%"; },
    uid: (function (){ var n=0; return function (){ return "cpd-u"+(++n); }; })(),
    esc: function (s){ return String(s==null?"":s).replace(/[&<>\"']/g, function (c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  };

  var RENDER = {};
  RENDER["04 YoY Metrics"] = function (rows, root, H){ root.innerHTML = '<h2>YoY performance</h2>' + renderYoY(rows); };
  RENDER["05 Monthly Metrics"] = function (rows, root, H){ root.innerHTML = '<h2>Monthly trends</h2>' + renderMonthly(rows); };
  RENDER["06 Prospecting Score Buckets"] = (function () {
function render(rows, root, H) {

  // ----- tier definitions -----
  var TIERS = [
    { key: 'notlogged', label: 'No score data (pre-2025-06)', color: '#C8CCD0', good: 0 },
    { key: 'unscored',  label: 'Unscored (≤0)',           color: C.RED,    good: -1 },
    { key: 'maxreach',  label: 'MaxReach (1–3332)',       color: '#D98C4A', good: -1 },
    { key: 'mi',        label: 'Mid Intent (3333–6665)',  color: '#C9A227', good: 0 },
    { key: 'pp',        label: 'Peak Perf (6666–8000)',   color: '#5FA88A', good: 1 },
    { key: 'hi',        label: 'High Intent (8001–10000)',color: '#1B6B4F', good: 1 }
  ];

  var p2lo = String(rows[0].p2_start_mo), p2hi = String(rows[0].p2_end_mo);

  function moLabel(ym){
    var p = ym.split('-'); var mi = parseInt(p[1],10)-1;

  // ---- View 2: monthly 100% stacked ----
  html += '<div style="font:700 14px Helvetica Neue,Arial;color:#222;margin:8px 0 2px">Prospecting score distribution by month</div>';
  html += '<div style="font:11px Helvetica Neue,Arial;color:#888;margin-bottom:6px">100% stacked — unscored spikes (top, red) are the score-level signature of a gate-OFF month.</div>';

  html += '<div style="font:700 14px Helvetica Neue,Arial;color:#222;margin:8px 0 4px">Score-tier distribution: Period 1 vs Period 2</div>';
  html += '<table style="border-collapse:collapse;width:100%;font:12px Helvetica Neue,Arial">';
  html += '<thead><tr>'
        + '<th style="text-align:left;padding:5px 8px;color:'+C.NAVY+';border-bottom:2px solid '+C.NAVY+'">Score tier</th>'
        + '<th style="text-align:right;padding:5px 8px;color:'+C.NAVY+';border-bottom:2px solid '+C.NAVY+'">Period 1<br>'+H.esc(p1Label)+'</th>'
        + '<th style="text-align:right;padding:5px 8px;color:'+C.NAVY+';border-bottom:2px solid '+C.NAVY+'">Period 2<br>'+H.esc(p2Label)+'</th>'
        + '<th style="text-align:right;padding:5px 8px;color:'+C.NAVY+';border-bottom:2px solid '+C.NAVY+'">Δ %</th>'
        + '</tr></thead><tbody>';
  // table rows: HI, PP, MI, MaxReach, Unscored, No-score (worst->best reversed for a scannable read)
  var TABLE_ORDER = ['hi','pp','mi','maxreach','unscored','notlogged'];
  TABLE_ORDER.forEach(function(k, i){
    var t = TIERS.filter(function(x){return x.key===k;})[0];
    var v1 = d1.pct[k], v2 = d2.pct[k];
    var delta = v1 ? 100*(v2-v1)/v1 : null;
    var ds = (delta===null) ? 'n/a' : (delta>=0?'+':'') + delta.toFixed(1) + '%';
    var dcolor = C.GRAY;
    if (delta !== null && t.good !== 0) dcolor = (delta * t.good > 0) ? C.GREEN : C.RED;

          + '<td style="text-align:left;padding:5px 8px;color:#222">'+H.esc(t.label)+'</td>'

  root.innerHTML = html;

  var barTiers = TIERS.slice();
  var barLabels = barTiers.map(function(t){ return t.label.split(' (')[0]; });

    type: 'bar',

      labels: barLabels,

        { label: p1Label, backgroundColor: C.NAVY, data: barTiers.map(function(t){ return +d1.pct[t.key].toFixed(1); }) },

    return {

      backgroundColor: s.color,
      borderColor: '#fff',
      borderWidth: 0.5,
      data: data.map(function(d){ return d.total ? +(100*d[s.key]/d.total).toFixed(1) : 0; })
    };
  });
  new Chart(document.getElementById(idStack).getContext('2d'), {
    type: 'bar',
    data: { labels: months.map(moLabel), datasets: stackDatasets },

      },
      plugins: {

        tooltip: { callbacks: { label: function(ctx){ return ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(1) + '%'; } } },
        datalabels: false
      }
    }
  });
}

  RENDER["08 Flights"] = (function () {

      scales: { x: { grid: { display: false }, ticks: { font: { size: 9 }, color: '#666' } },
                y: { beginAtZero: true, grid: { color: '#eee' }, ticks: { font: { size: 9 }, color: '#666' } },
                y2: { position: 'right', beginAtZero: true, grid: { display: false }, ticks: { font: { size: 9 }, color: C.RED } } } }
  });
}
  return render; })();
  // Modules grouped into tabs by diagnostic category. A module's `tab` decides where it
  // renders; tab panels are lazy-rendered on first activation so Chart.js always sizes
  // against a visible container (charts built inside display:none get 0-width canvases).
  var TABS = ["Overview", "Audience & Scores", "Gate & Flights", "Delivery & Measurement", "Retargeting"];
  var MODULES = [
    { title: "Diagnostic flags", name: "_flags", sig: "", tab: "Overview", multi: true },
    { title: "YoY performance", name: "04 YoY Metrics", sig: "period", tab: "Overview" },
    { title: "Monthly trends", name: "05 Monthly Metrics", sig: "month", tab: "Overview" },
    { title: "Campaign summary (window)", name: "00b Reach By Score", sig: "reach_ip", tab: "Audience & Scores" },
    { title: "Score-tier distribution", name: "06 Prospecting Score Buckets", sig: "notlogged", tab: "Audience & Scores" },
    { title: "Audience change log", name: "07 Audience Changelog", sig: "clog_ds_ids", tab: "Audience & Scores" },
    { title: "Geo targeting changes", name: "12 Geo Changes", sig: "n_dma", tab: "Audience & Scores" },
    { title: "HHST gate history", name: "03 HHST Gate History", sig: "gate_threshold", tab: "Gate & Flights" },
    { title: "HHST gate ribbon", name: "03b Gate Ribbon", sig: "gate_ribbon_grp_spend", tab: "Gate & Flights" },
    { title: "Prospecting flights", name: "08 Flights", sig: "flight_days", tab: "Gate & Flights" },
    { title: "Campaign spans", name: "01 Campaign Group Gantt", sig: "first_active_day", tab: "Delivery & Measurement" },
    { title: "Verified-visit window", name: "11 VV Window", sig: "vv_change_date", tab: "Delivery & Measurement" },
    { title: "Retargeting reach & recirculation", name: "09rt Retargeting Reach", sig: "rt_reach", tab: "Retargeting" },
  ];

  function renderModule(m, sec) {
    if (m.multi) { // cross-dataset module: resolves its own datasets via ds()
      try { RENDER[m.name](null, sec, H); }
      catch (e) { sec.innerHTML = '<h2>' + m.title + '</h2><div class="err">render error: ' + (e && e.message) + '</div>'; }
      return;
    }
    var rows = ds(m.name, m.sig);
    if (rows) { try { RENDER[m.name](rows, sec, H); }
      catch (e) { sec.innerHTML = '<h2>' + m.title + '</h2><div class="err">render error: ' + (e && e.message) + '</div>'; } }
    else { sec.innerHTML = '<h2>' + m.title + '</h2><div class="err">' + m.name + ' — no data (Run the query)</div>'; }
  }

  function renderAll() {
    var root = document.getElementById("cpd");
    root.innerHTML = '<h1>Client Performance Diagnostic</h1>'
      + '<div class="sub">Prospecting diagnostic · selected period (P2) vs same period last year (P1) · % spend = whole campaign group, retargeting excluded</div>';

    var bar = document.createElement("div"); bar.className = "tabbar";
    root.appendChild(bar);

    var panels = {}, rendered = {}, buttons = {};
    TABS.forEach(function (t) {
      var p = document.createElement("div");
      p.style.display = "none";
      root.appendChild(p);
      panels[t] = p;
    });

    function activate(t) {
      TABS.forEach(function (x) {
        panels[x].style.display = (x === t) ? "" : "none";
        buttons[x].className = "tabbtn" + (x === t ? " active" : "");
      });
      if (!rendered[t]) {
        rendered[t] = true;
        MODULES.forEach(function (m) {
          if (m.tab !== t) return;
          var sec = document.createElement("div"); sec.style.margin = "0 0 10px";
          panels[t].appendChild(sec);
          renderModule(m, sec);
        });
      }
    }

    TABS.forEach(function (t) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "tabbtn"; b.textContent = t;
      b.onclick = function () { activate(t); };
      bar.appendChild(b);
      buttons[t] = b;
    });

    activate(TABS[0]);
  }
  var tries = 0;
  (function wait() {
    if (window.datasets && window.datasets.length) return renderAll();
    if (++tries > 40) return renderAll();
    setTimeout(wait, 100);
  })();
})();
</script>
