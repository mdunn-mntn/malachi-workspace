     Renders (1) the prospecting YoY metrics table and (2) monthly trend charts (Chart.js),
     both resolved from window.datasets by query name. This is module 04 + 05 only; the
     remaining ~20 modules follow the same pattern (add a query -> resolve -> render). -->

     (throws "This method is not implemented: Check that a complete date adapter is provided").

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<div id="cpd"><div class="loading">Loading client performance diagnostic…</div></div>

<script>
(function () {
  "use strict";
  var NAVY = "#27496D", RED = "#D63B2F", GRAY = "#9AA0A6";

  // ---- resolve a Mode dataset: by normalized name first, else by a signature column.
  //      Robust to query naming ("04 YoY Metrics" vs "04_yoy_metrics") and to Mode not
  //      exposing .name — a dataset is identified by a column only it has (period / month). ----
  var norm = function (s) { return (s || "").toString().toLowerCase().replace(/[^a-z0-9]/g, ""); };
  function withRows(d) { return d && Array.isArray(d.content) && d.content.length; }
  function ds(name, sigCol) {
    var all = window.datasets;
    if (!all || !all.length) return null;
    var hit = all.find(function (d) { return withRows(d) && norm(d.name) === norm(name); });
    if (!hit && sigCol) hit = all.find(function (d) {
      return withRows(d) && Object.prototype.hasOwnProperty.call(d.content[0], sigCol);
    });
    return hit ? hit.content : null;
  }
  var num = function (v) { return v == null || v === "" ? 0 : +v; };
  var fmtK = function (v) { var a = Math.abs(v);
    return a >= 1e6 ? (v/1e6).toFixed(1)+"M" : a >= 1e3 ? Math.round(v/1e3)+"k" : Math.round(v).toString(); };
  var money = function (v) { return "$" + fmtK(v); };

  // metric = [label, fn(row)->value, formatter, goodDir]  (goodDir: +1 up-good, -1 down-good, 0 context)
  var METRICS = [
    // raw counts — funnel order (spend in -> delivery -> visit -> conversion -> revenue out)
    ["Spend",            function (r){return r.spend;},                       money,                              0],
    ["Impressions",      function (r){return r.impressions;},                 function (v){return fmtK(v);},      0],
    ["Visits",           function (r){return r.visits;},                      function (v){return fmtK(v);},      1],
    ["Conversions",      function (r){return r.conversions;},                 function (v){return fmtK(v);},      1],
    ["Revenue",          function (r){return r.revenue;},                     money,                              1],
    // calculated rates — funnel order again (CPM -> IVR -> CVR -> AOV -> ROAS)
    ["CPM",              function (r){return 1000*r.spend/r.impressions;},     function (v){return "$"+v.toFixed(2);}, -1],
    ["IVR",              function (r){return 100*r.visits/r.impressions;},     function (v){return v.toFixed(3)+"%";}, 1],
    ["CVR",              function (r){return 100*r.conversions/r.visits;},     function (v){return v.toFixed(2)+"%";}, 1],
    ["AOV",              function (r){return r.revenue/r.conversions;},        function (v){return "$"+v.toFixed(2);}, 1],
    ["ROAS",             function (r){return r.revenue/r.spend;},              function (v){return v.toFixed(2)+"x";}, 1]
  ];

  function renderYoY(rows) {
    var P = {};
    rows.forEach(function (r) { P[r.period] = { impressions:num(r.impressions), visits:num(r.visits),
      spend:num(r.spend), conversions:num(r.conversions), revenue:num(r.revenue) }; });
    if (!P.P1 || !P.P2) return '<div class="err">YoY table needs both P1 and P2 rows (got: ' + Object.keys(P).join(", ") + ").</div>";
    var h = '<table><tr><th class="metric">Metric</th><th>Prior year (P1)</th><th>Selected (P2)</th><th>Δ %</th></tr>';
    METRICS.forEach(function (m) {
      var v1 = m[1](P.P1), v2 = m[1](P.P2), fmt = m[2], good = m[3];
      var d = v1 ? 100*(v2/v1 - 1) : null;
      var cls = (good === 0 || d == null) ? "ctx" : (d*good > 0 ? "good" : "bad");
      h += '<tr><td class="metric">' + m[0] + "</td><td>" + (isFinite(v1)?fmt(v1):"—")
        + "</td><td>" + (isFinite(v2)?fmt(v2):"—") + '</td><td class="delta ' + cls + '">'
        + (d == null ? "n/a" : (d>=0?"+":"") + d.toFixed(1) + "%") + "</td></tr>";
    });
    return h + "</table>";
  }

  // small monthly line chart into a <canvas>
  function line(canvas, labels, data, color) {
    new Chart(canvas, { type:"line",
      data:{ labels:labels, datasets:[{ data:data, borderColor:color, backgroundColor:color,
             borderWidth:2, pointRadius:2, tension:0.15, spanGaps:true }] },
      options:{ plugins:{legend:{display:false}}, responsive:true, maintainAspectRatio:false,
        scales:{ x:{ ticks:{ maxTicksLimit:6, font:{size:10} }, grid:{display:false} },
                 y:{ ticks:{ font:{size:10} }, grid:{color:"#eee"} } } } });
  }

  function renderMonthly(rows) {
    rows = rows.slice().sort(function (a,b){ return a.month < b.month ? -1 : 1; });
    var labels = rows.map(function (r){ return r.month; });
    var series = [
      // raw counts — funnel order
      ["Spend", rows.map(function(r){return num(r.spend);}), NAVY],
      ["Impressions", rows.map(function(r){return num(r.impressions);}), NAVY],
      ["Visits", rows.map(function(r){return num(r.visits);}), NAVY],
      ["Conversions", rows.map(function(r){return num(r.conversions);}), NAVY],
      ["Revenue", rows.map(function(r){return num(r.revenue);}), NAVY],
      // calculated rates — funnel order
      ["CPM", rows.map(function(r){var i=num(r.impressions);return i?1000*num(r.spend)/i:null;}), NAVY],
      ["IVR %", rows.map(function(r){var i=num(r.impressions);return i?100*num(r.visits)/i:null;}), NAVY],
      ["CVR %", rows.map(function(r){var v=num(r.visits);return v?100*num(r.conversions)/v:null;}), RED],
      ["AOV", rows.map(function(r){var c=num(r.conversions);return c?num(r.revenue)/c:null;}), NAVY],
      ["ROAS", rows.map(function(r){var s=num(r.spend);return s?num(r.revenue)/s:null;}), RED]

    var html = '<div class="grid">' + series.map(function (s, i) {

    money: function (v){ return "$"+H.fmtK(v); },

    uid: (function (){ var n=0; return function (){ return "cpd-u"+(++n); }; })(),
    esc: function (s){ return String(s==null?"":s).replace(/[&<>\"']/g, function (c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  };

  var RENDER = {};
  RENDER["04 YoY Metrics"] = function (rows, root, H){ root.innerHTML = '<h2>YoY performance</h2>' + renderYoY(rows); };
  RENDER["05 Monthly Metrics"] = function (rows, root, H){ root.innerHTML = '<h2>Monthly trends</h2>' + renderMonthly(rows); };
  RENDER["06 Prospecting Score Buckets"] = (function () {
function render(rows, root, H) {
  var C = H.C;
  if (!rows || !rows.length) { root.innerHTML = '<div style="padding:16px;color:#888;font:13px Helvetica Neue,Arial">No prospecting score data for this advertiser/period.</div>'; return; }

  // ----- tier definitions -----
  var TIERS = [
    { key: 'notlogged', label: 'No score data (pre-2025-06)', color: '#C8CCD0', good: 0 },
    { key: 'unscored',  label: 'Unscored (≤0)',           color: C.RED,    good: -1 },
    { key: 'maxreach',  label: 'MaxReach (1–3332)',       color: '#D98C4A', good: -1 },
    { key: 'mi',        label: 'Mid Intent (3333–6665)',  color: '#C9A227', good: 0 },
    { key: 'pp',        label: 'Peak Perf (6666–8000)',   color: '#5FA88A', good: 1 },
    { key: 'hi',        label: 'High Intent (8001–10000)',color: '#1B6B4F', good: 1 }
  ];
  var KEYS = ['notlogged','unscored','maxreach','mi','pp','hi'];

  // ----- normalize rows -----

  }).sort(function(a,b){ return a.mo < b.mo ? -1 : a.mo > b.mo ? 1 : 0; });

  var p1lo = String(rows[0].p1_start_mo), p1hi = String(rows[0].p1_end_mo);

  function moLabel(ym){
    var p = ym.split('-'); var mi = parseInt(p[1],10)-1;
    var mn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][mi] || ym;
    return mn + " '" + p[0].slice(2);
  }
  var p1Label = moLabel(p1lo) + '–' + moLabel(p1hi);

        + '</tr></thead><tbody>';
  // table rows: HI, PP, MI, MaxReach, Unscored, No-score (worst->best reversed for a scannable read)

  TABLE_ORDER.forEach(function(k, i){
    var t = TIERS.filter(function(x){return x.key===k;})[0];
    var v1 = d1.pct[k], v2 = d2.pct[k];
    var delta = v1 ? 100*(v2-v1)/v1 : null;
    var ds = (delta===null) ? 'n/a' : (delta>=0?'+':'') + delta.toFixed(1) + '%';
    var dcolor = C.GRAY;
    if (delta !== null && t.good !== 0) dcolor = (delta * t.good > 0) ? C.GREEN : C.RED;

    html += '<tr style="background:'+bg+'">'

          + '<td style="text-align:right;padding:5px 8px;color:#222">'+v2.toFixed(1)+'%</td>'

  });
  html += '</tbody></table>';

  root.innerHTML = html;

  // ===== Chart.js: View 1 grouped bars =====

  var barTiers = TIERS.slice();
  var barLabels = barTiers.map(function(t){ return t.label.split(' (')[0]; });
  new Chart(document.getElementById(idBars).getContext('2d'), {
    type: 'bar',
    data: {
      labels: barLabels,
      datasets: [
        { label: p1Label, backgroundColor: C.NAVY, data: barTiers.map(function(t){ return +d1.pct[t.key].toFixed(1); }) },
        { label: p2Label, backgroundColor: C.RED,  data: barTiers.map(function(t){ return +d2.pct[t.key].toFixed(1); }) }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,

        y: { beginAtZero: true, suggestedMax: 100, grid: { color: '#DDD' }, ticks: { font: { size: 10 }, color: '#555', callback: function(v){ return v + '%'; } } }

        legend: { position: 'top', labels: { font: { size: 11 }, boxWidth: 12, color: '#333' } },

    { key: 'mi',        color: '#C9A227', label: 'Mid Intent' },

  ];
  var months = data.map(function(d){ return d.mo; });
  var stackDatasets = STACK.map(function(s){
    return {

  });

    type: 'bar',
    data: { labels: months.map(moLabel), datasets: stackDatasets },

        y: { stacked: true, min: 0, max: 100, grid: { color: '#EEE' }, ticks: { font: { size: 9 }, color: '#555', stepSize: 25, callback: function(v){ return v + '%'; } } }
      },

        datalabels: false
      }
    }
  });
}
  return render; })();
  RENDER["08 Flights"] = (function () {
